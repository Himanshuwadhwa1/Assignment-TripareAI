version: '3.8'

services:
  postgresql:
    image: postgres:14-alpine
    container_name: hotel-postgresql
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hotel-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--ns", "default", "namespace", "describe"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: hotel-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      temporal:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-api
    command: node dist/server.js
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-offers
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_A_URL=http://api:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://api:3000/supplierB/hotels
      - SUPPLIER_TIMEOUT_MS=3000
      - SUPPLIER_A_DOWN=false
      - SUPPLIER_B_DOWN=false
      - HOTELS_TTL_SECONDS=300
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-worker
    command: node dist/temporal/worker.js
    environment:
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hotel-offers
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_A_URL=http://api:3000/supplierA/hotels
      - SUPPLIER_B_URL=http://api:3000/supplierB/hotels
      - SUPPLIER_TIMEOUT_MS=3000
      - HOTELS_TTL_SECONDS=300
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_started
